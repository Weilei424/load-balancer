<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Raft Load Balancer Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1.5rem}
h1{font-size:1.5rem;font-weight:700;margin-bottom:1rem;color:#38bdf8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1.5rem}
.card{background:#1e293b;border-radius:.75rem;padding:1.25rem;border:1px solid #334155}
.card h2{font-size:.875rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.75rem}
.stat{font-size:1.75rem;font-weight:700;color:#f1f5f9}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:9999px;font-size:.75rem;font-weight:600}
.badge.leader{background:#15803d;color:#dcfce7}
.badge.follower{background:#1d4ed8;color:#dbeafe}
.badge.candidate{background:#b45309;color:#fef3c7}
.badge.unknown{background:#475569;color:#e2e8f0}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;color:#94a3b8;font-weight:600;padding:.5rem;border-bottom:1px solid #334155}
td{padding:.5rem;border-bottom:1px solid #1e293b}
.healthy{color:#4ade80}
.unhealthy{color:#f87171}
#timeline{list-style:none;font-size:.85rem}
#timeline li{padding:.3rem 0;border-bottom:1px solid #1e293b;color:#94a3b8}
#timeline li span.leader-name{color:#38bdf8;font-weight:600}
.conn-bar{display:inline-block;background:#0ea5e9;height:6px;vertical-align:middle;border-radius:3px;min-width:2px;max-width:80px}
#status{position:fixed;top:.75rem;right:1rem;font-size:.75rem;color:#64748b}
#status.connected{color:#4ade80}
#status.disconnected{color:#f87171}
</style>
</head>
<body>
<span id="status">⬤ connecting…</span>
<h1>🔁 Raft Load Balancer</h1>

<div class="grid">
  <div class="card">
    <h2>This Node</h2>
    <div><span id="node-id" class="stat">—</span></div>
    <div style="margin-top:.5rem"><span id="role-badge" class="badge unknown">unknown</span></div>
  </div>
  <div class="card">
    <h2>Raft Status</h2>
    <table>
      <tr><td>Term</td><td id="term">—</td></tr>
      <tr><td>Leader</td><td id="leader">—</td></tr>
      <tr><td>CommitIndex</td><td id="commit">—</td></tr>
      <tr><td>LastApplied</td><td id="applied">—</td></tr>
    </table>
  </div>
  <div class="card">
    <h2>Traffic</h2>
    <div class="stat" id="reqs">0</div>
    <div style="margin-top:.25rem;color:#94a3b8;font-size:.8rem">total requests</div>
    <div style="margin-top:.5rem;color:#f87171;font-size:.8rem">errors: <span id="errs">0</span></div>
  </div>
  <div class="card">
    <h2>Routing Algorithm</h2>
    <div class="stat" id="algo">—</div>
  </div>
</div>

<div class="card" style="margin-bottom:1rem">
  <h2>Backends</h2>
  <table>
    <thead><tr><th>URL</th><th>Weight</th><th>Health</th><th>Connections</th></tr></thead>
    <tbody id="backends"></tbody>
  </table>
</div>

<div class="card">
  <h2>Leader Timeline</h2>
  <ul id="timeline"><li>No events yet.</li></ul>
</div>

<script>
const statusEl = document.getElementById('status');
const timeline = [];
let prevLeader = null;

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { statusEl.textContent = '⬤ connected'; statusEl.className = 'connected'; };
  es.onerror = () => { statusEl.textContent = '⬤ disconnected'; statusEl.className = 'disconnected'; setTimeout(connect, 3000); es.close(); };
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    update(d);
  };
}

function update(d) {
  document.getElementById('node-id').textContent = d.id || '—';
  const badge = document.getElementById('role-badge');
  badge.textContent = d.role || 'unknown';
  badge.className = 'badge ' + (d.role || 'unknown');
  document.getElementById('term').textContent = d.term ?? '—';
  document.getElementById('leader').textContent = d.leader_id || '(none)';
  document.getElementById('commit').textContent = d.commit_index ?? '—';
  document.getElementById('applied').textContent = d.last_applied ?? '—';
  document.getElementById('reqs').textContent = d.requests_total ?? 0;
  document.getElementById('errs').textContent = d.errors_total ?? 0;
  document.getElementById('algo').textContent = d.algorithm || '—';

  // Backends table
  const tbody = document.getElementById('backends');
  tbody.innerHTML = '';
  (d.backends || []).forEach(b => {
    const tr = document.createElement('tr');
    const connPct = Math.min(b.conn_count * 8, 80);
    tr.innerHTML = `
      <td>${b.url}</td>
      <td>${b.weight}</td>
      <td class="${b.healthy ? 'healthy' : 'unhealthy'}">${b.healthy ? '✓ healthy' : '✗ down'}</td>
      <td>${b.conn_count} <span class="conn-bar" style="width:${connPct}px"></span></td>
    `;
    tbody.appendChild(tr);
  });

  // Timeline
  if (d.leader_id && d.leader_id !== prevLeader) {
    prevLeader = d.leader_id;
    timeline.unshift({ leader: d.leader_id, term: d.term, at: new Date().toLocaleTimeString() });
    if (timeline.length > 20) timeline.pop();
    const ul = document.getElementById('timeline');
    ul.innerHTML = timeline.map(ev =>
      `<li>[${ev.at}] term ${ev.term} → leader <span class="leader-name">${ev.leader}</span></li>`
    ).join('');
  }
}

connect();
</script>
</body>
</html>
