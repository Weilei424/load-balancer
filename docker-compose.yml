name: raft-lb

services:

  # ── Backend echo servers ──────────────────────────────────────────────────

  backend1:
    build: .
    command: ["backend", "--id", "b1", "--listen", ":9101"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend2:
    build: .
    command: ["backend", "--id", "b2", "--listen", ":9102"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9102/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend3:
    build: .
    command: ["backend", "--id", "b3", "--listen", ":9103"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9103/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── LB nodes ─────────────────────────────────────────────────────────────

  lb1:
    build: .
    command: ["node", "--config", "configs/docker/n1.yaml"]
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  lb2:
    build: .
    command: ["node", "--config", "configs/docker/n2.yaml"]
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  lb3:
    build: .
    command: ["node", "--config", "configs/docker/n3.yaml"]
    ports:
      - "9003:9003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  # ── One-shot setup: adds backends via Raft after cluster is healthy ───────

  setup:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        NODES="http://lb1:9001,http://lb2:9002,http://lb3:9003"
        add_backend() {
          local url="$1" attempt=0
          until /app/lb admin add-backend --url "$url" --nodes "$NODES"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 20 ]; then
              echo "ERROR: failed to register $url after $attempt attempts" >&2
              exit 1
            fi
            echo "No leader yet, retrying $url in 3s (attempt $attempt)..."
            sleep 3
          done
        }
        add_backend http://backend1:9101
        add_backend http://backend2:9102
        add_backend http://backend3:9103
        echo "Setup complete."
    depends_on:
      lb1:
        condition: service_healthy
      lb2:
        condition: service_healthy
      lb3:
        condition: service_healthy
    restart: "no"
